; ******* Rocket Types *******
; This lists all of the rocket types in the game. Each rocket
; type should have a matching section that specifies the data it
; requires.
[RocketTypes]
0=SBOATRCKT
1=V2ROCKET
2=SSROCKET
3=P941ROCKET

; PauseFrames = how many frames the rocket pauses on the launcher before tilting (def=0)
; TiltFrames = how many frames it takes for the rocket to tilt to firing position (def=60)
; PitchInitial = starting pitch of the rocket before tilting up (0 = horizontal, 1 = vertical, def=0.21)
; PitchFinal = ending pitch of the rocket after tilting up before it fires (def=0.5)
; TurnRate = pitch maneuverability of rocket in air (def=0.05)
; RaiseRate = how much the missile will raise each turn on the launcher (for Cruise Missiles only, def=1)
; Acceleration = this much is added to the rocket's velocity each frame during launch (def=0.4)
; Altitude = cruising altitude in leptons (1/256 of a cell): at this height rocket begins leveling off (def=768)
; Damage = the rocker does this much damage when it explodes (def=200)
; EliteDamage = the rocker does this much damage when it explodes when the spawner is elite (def=400)
; BodyLength = the length of the body of the rocket in leptons (1/256 of a cell, def=256)
; LazyCurve = is the rocket's path a big, lazy curve, like the V3 is Red Alert 2 (def=yes)
; CruiseMissile = is this rocket a Cruise Missile, like Boomer missiles in Yuri's Revenge (def=no)
; CloseEnoughFactor = LazyCurve=no rockets begin turning toward their target after flying parallel to the ground when their horizontal distance from the target is a specified multiple of their vertical distance (def=1.0)
; Type = the AircraftType this rocket is associated with
; Warhead = the warhead that this rocket's explosion uses
; EliteWarhead = the warhead that this rocket's explosion uses when the spawner is elite
; TakeoffAnim = the takeoff animation used by this rocket
; TrailAnim = the trail animation used by this rocket

