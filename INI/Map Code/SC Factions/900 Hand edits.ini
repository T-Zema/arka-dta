; Layer "Hand edits" of the skirmish faction map code (chain: INI/Map Code/Terran Faction.ini; wiki: engine/map-code-layers).
; Top layer: hand-made overrides that win over every generated layer. Edit them here (no generator rewrites this file);
; a new generated layer goes BELOW this one (MapCode.ps1 New-MapCodeLayer does that).
[INISystem]
BasedOn=100 SC air armor.ini

; >>> Crate goodies (SC factions)
; Crate fix (2026-10-25: the game froze when a Zerg Hydralisk picked up a crate, last log line "Crate at 89,136 contains a unit").
; The "Unit" crate rolls random VehicleTypes until one has CrateGoodie=yes and an Owner= the player's house may own. Every
; classic house (and GDI1 = Terran) owns 11-13 such vehicles, but Nod1 (Zerg) and GDI2 (Protoss) owned none, so the roll never
; ended. Repeated sections: the client merges them with the faction blocks (later keys win). Wiki: engine/crates.
[SCZMUT]
CrateGoodie=yes

[SCZQUN]
CrateGoodie=yes

[SCZGRD]
CrateGoodie=yes

[SCPREAV]
CrateGoodie=yes

[SCPSCOU]
CrateGoodie=yes

[SCPCORS]
CrateGoodie=yes
; <<< Crate goodies (SC factions)

; >>> Worker capacity (SC factions)
; User 2026-10-25: Probe and the other SC workers deliver 30% more per trip (Storage 10 -> 13). The Probe has it in the
; "Protoss faction" block (build-scprotoss.ps1); the Zerg Drone here as a repeated section (the client merges, later wins);
; the Terran SCV in the same-named block at the end of INI/Game Options/StarCraft.ini (appended after this file).
[SCZWORK]
Storage=13
; <<< Worker capacity (SC factions)

; >>> SC balance (user)
; User balance changes kept outside the generated blocks (the client merges repeated sections, later keys win), so re-running
; build-sczergbase.ps1 / build-sczergresearch.ps1 does not undo them. Wiki: mods/zerg-faction.
; 2026-10-26: Zergling 20% slower (it stuttered when walking diagonally); Speed is an integer: 12 -> 10, Upgraded 18 -> 14.
; 2026-10-27: guard range +1 cell (no GuardRange = the claw's Range 1.75 -> 2.75); the claw range stays 1.75.
; 2026-10-30: one more cell (user: "zwieksz zasieg reagowania zerglingow o 1 pole"): 2.75 -> 3.75.
[SCZLNG]
Speed=10
GuardRange=3.75

[SCZLNG2]
Speed=14
GuardRange=3.75

; the hero Zergling (Devouring One) too: its claw Range 2.28 -> guard 3.28 (2026-10-30: 4.28)
[SCZHDO]
GuardRange=4.28

; 2026-10-27: Overlords raise the silo capacity like a Supply Depot / Pylon / Creep Colony (Storage=100). Needs the game.exe
; patch tools/patch-overlordstorage.ps1 (units count in House Capacity) and tools/patch-vinifera-overlord.ps1 (the surplus over
; the buildings' own storage goes into a Zerg storage building). Wiki: plans/overlord-storage.
[SCZOVL]
Storage=100

[SCZOVL2]
Storage=100

[SCZHYG]
Storage=100

