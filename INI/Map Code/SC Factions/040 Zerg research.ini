; >>> Zerg research
; =====================================================================================================================
; Zerg research (generated by Modding/tools/build-sczergresearch.ps1, do not edit by hand; wiki: mods/zerg-research).
; SC upgrades = building upgrades (PowersUpBuilding) grown in the Structures tab and placed on the Zerg building that
; researches them in SC (like the Terran research of build-scresearch.ps1). Units list research in Prerequisite=
; (Vinifera Has_Prerequisite scans Upgrades[]). Repeated sections below ADD keys to the "Zerg faction" sections (the
; client merges repeated sections, later keys win): Upgrades=N on the parents, Factory=BuildingType on the tech buildings.
; =====================================================================================================================

