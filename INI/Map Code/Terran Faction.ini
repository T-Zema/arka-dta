; Map code of the skirmish factions: Terran (house GDI1, side 6), Zerg (Nod1, side 7), Protoss (GDI2, side 8). The client
; appends it to every skirmish map (INI/MPMaps.ini: MapCodeININame=Terran Faction.ini in [Default] and [Custom Map]);
; missions do not load it (ARKA mission scripts copy the SC types they use into the map).
;
; This file is only the entry. The rules are in layers INI/Map Code/SC Factions/NNN <name>.ini; each names the layer
; below it in [INISystem] BasedOn=, and the client (Rampastring.Tools IniFile) loads them bottom first, every layer over
; the ones below (later keys win, repeated list sections merge). Chain, bottom first:
;   000  Terran faction              hand-made: house GDI1 = Terran, Owner clones of the Allies, start unit, shared
;                                    [General] BaseUnit=/HarvesterUnit= (the Zerg and Protoss generators edit them)
;   010  Zerg faction                build-sczergbase.ps1 -Install
;   020  Protoss faction             build-scprotoss.ps1 -Install
;   030  Zerg heroes                 build-sczergheroes.ps1 -Install
;   040  Zerg research               build-sczergresearch.ps1
;   050  SC building select sounds   build-scbldgsounds.ps1 -Install
;   060  SC workers                  build-scworkers.ps1 -Install
;   070  Protoss research            build-scprotossresearch.ps1
;   080  Zerg creep                  build-sczergcreep.ps1
;   090  Zerg death sounds           build-sczergdeath.ps1
;   100  SC air armor                build-scairarmor.ps1
;   900  Hand edits                  hand-made overrides on top: Crate goodies (SC factions), Worker capacity (SC factions), SC balance (user)
;
; Generated layers: change the generator, not the file. Scripts reach a layer by its name (Modding/tools/MapCode.ps1:
; Get-MapCodeLayer, Read-MapCodeText = all layers as one text, New-MapCodeLayer). Wiki: Modding/wiki/engine/map-code-layers.md
[INISystem]
BasedOn=SC Factions/900 Hand edits.ini
