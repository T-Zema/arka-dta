; ******* Land Characteristics *******
; This section specifies the characteristics of the various
; terrain types. The primary purpose is to differentiate the
; movement capabilities.

; Float = % of full speed for ships [0 means impassable] (def=0)
; Foot = % of full speed for foot soldiers [0 means impassable] (def=0)
; Track = % of full speed for tracked vehicles [0 means impassable] (def=0)
; Wheel = % of full speed for wheeled vehicles [0 means impassable] (def=0)
; Hover = % of full speed for hovering vehicles [0 means impassable] (def=0)
; Amphibious = % of full speed for amphibious vehicles [0 impassable] (def=0)
; Buildable = Can buildings be built upon this terrain (def=no)?

; A unit's specified MovementZone uses the land type's value specified for
; Wheel= to check whether a cell is valid to be included when calculating paths
; for units. With exception of Water and Beach, any land type that has Wheel=0%
; will be inaccessible for all units, aside from those using MovementZone=Fly.

; clear terrain
