; Reversed=yes will make an enabled checkbox set the associated key to =False instead of =True.

[cmbClassicEnhanced]
$Width=97
$Height=21
$X=16
$Y=26
Items=Classic,Enhanced
DefaultIndex=1
SpawnIniOption=Firestorm
DataWriteMode=Boolean

[lblClassicEnhanced]
Text=Game Type:
$X=getX(cmbClassicEnhanced)
$Y=getY(cmbClassicEnhanced) - 19

[cmbTechLevel]
$Width=97
$Height=21
$X=getX(cmbClassicEnhanced)
$Y=getY(cmbClassicEnhanced) + 58
OptionName=Tech Level
Items=7,6,5,4,3,2,1
DefaultIndex=0
SpawnIniOption=TechLevel
DataWriteMode=String

[lblTechLevel]
Text=Tech Level:
$X=getX(cmbTechLevel)
$Y=getY(cmbTechLevel) - 19

[cmbCredits]
$Width=97
$Height=21
$X=getX(cmbClassicEnhanced)
$Y=getY(cmbTechLevel) + 58
OptionName=Starting Credits
Items=20000,15000,12500,10000,7500,5000,2500
DefaultIndex=3
SpawnIniOption=Credits
DataWriteMode=String

[lblCredits]
Text=Starting Credits:
$X=getX(cmbCredits)
$Y=getY(cmbCredits) - 19

[cmbGameSpeedCap]
$Width=97
$Height=21
$X=getX(cmbClassicEnhanced)
$Y=getY(cmbCredits) + 58
OptionName=Game Speed
Items=Maximum,60 FPS,45 FPS,30 FPS,20 FPS,15 FPS,10 FPS
DefaultIndex=1
SpawnIniOption=GameSpeed
DataWriteMode=Index

[lblGameSpeedCap]
Text=Game Speed:
$X=getX(cmbGameSpeedCap)
$Y=getY(cmbGameSpeedCap) - 19

[chkIngameAllying]
Text=Ingame Allying	;Locked Teams
SpawnIniOption=AlliesAllowed
Checked=False
Enabled=False
AllowChecking=false
;Reversed=true
ToolTip=Players can form and break alliances in the middle of the game by selecting a unit or structure of another human player and then pressing "A" on the keyboard.
Visible=False
$X=getX(cmbClassicEnhanced)
$Y=getBottom($ParentControl) - 38

[chkSuperMod]
Text=SUPER MOD
CustomIniPath=INI/Game Options/Super Mod.ini
Checked=False
ToolTip=Every faction can build 8 new units: Flying Mammoth, Atomic Tank, Tesla Mammoth, Prism Tank, Ghost Tank, Tesla Commando, Sky Trooper and Laser Trooper. Everything is built 2x faster.
MapScoringMode=DenyWhenChecked
$X=getX(cmbClassicEnhanced)
$Y=getBottom($ParentControl) - 38

[chkShortGame]
Text=Short Game
SpawnIniOption=ShortGame
Checked=True
ToolTip=Having only units and no structures left will cause the units to self-destruct and make the player instantly lose the game.
$X=128
$Y=9

[chkRedeplMCV]
Text=Re-Deployable MCV
SpawnIniOption=MCVRedeploy
Checked=True
ToolTip=Construction Yards can repack into a Mobile Construction Vehicle.
$X=getX(chkShortGame)
$Y=getY(chkShortGame) + CHECKBOX_SPACING

[chkCrates]
Text=Crates
SpawnIniOption=Crates
EnabledSpawnIniValue=False
DisabledSpawnIniValue=True
;CustomIniPath=INI/Game Options/No Crates.ini
Reversed=yes
Checked=True
ToolTip=Collectable crates will appear in random locations on the map, granting credits, tiberium, units, unit power-ups, air strikes, area heal, global heal or booby traps.
$X=getX(chkShortGame)
$Y=getY(chkRedeplMCV) + CHECKBOX_SPACING

[chkNoBaddyCrates]
Text=Safe Crates Only
CustomIniPath=INI/Game Options/No Baddy Crates.ini
Checked=False
ToolTip=No crates with potential negative effects will appear if crates are enabled.
$X=getX(chkShortGame)
$Y=getY(chkCrates) + CHECKBOX_SPACING

[chkMultiEng]
Text=Multi Engineer
SpawnIniOption=MultiEngineer
Checked=False
ToolTip=Capturing a structure requires three Engineers instead of one.
$X=getX(chkShortGame)
$Y=getY(chkNoBaddyCrates) + CHECKBOX_SPACING

[chkStartingUnits]
Text=Starting Forces
;CustomIniPath=INI/Game Options/Starting Units.ini
SpawnIniOption=UnitCount
EnabledSpawnIniValue=7
DisabledSpawnIniValue=1
Checked=False
;ToolTip=You will receive a small group of controllable units about a minute after the game starts.
ToolTip=Start with a group of basic infantry and tanks surrounding your MCV.
$X=getX(chkShortGame)
$Y=getY(chkMultiEng) + CHECKBOX_SPACING

[chkBuildOffAlly]
Text=Build Off Ally
SpawnIniOption=BuildOffAlly
Checked=True
ToolTip=Allow building next to structures of teammates.
$X=getX(chkShortGame)
$Y=getY(chkStartingUnits) + CHECKBOX_SPACING

[chkCrushableInfantry]
Text=Crushable Infantry
Reversed=yes
CustomIniPath=INI/Game Options/Uncrushable Infantry.ini
Checked=True
ToolTip=Infantry can be crushed by heavy vehicles.
$X=getX(chkShortGame)
$Y=getY(chkBuildOffAlly) + CHECKBOX_SPACING

[chkVisceroids]
Text=Visceroids
Reversed=yes
CustomIniPath=INI/Game Options/Disable Visceroids.ini
Checked=True
ToolTip=Infantry that die from walking over tiberium will become visceroids and some maps will already have visceroids present from the start.
$X=getX(chkShortGame)
$Y=getY(chkCrushableInfantry) + CHECKBOX_SPACING

[chkScrapDebris]
Text=Scrap Debris
SpawnIniOption=ScrapMetal
Checked=True
ToolTip=Buildings and vehicles spawn harvestable scrap debris when they're destroyed.
$X=getX(chkShortGame)
$Y=getY(chkVisceroids) + CHECKBOX_SPACING

[chkHarmlessTiberium]
Text=Harmless Tiberium
CustomIniPath=INI/Game Options/Harmless Tiberium.ini
Checked=False
ToolTip=Tiberium will no longer do damage to infantry that walk over it and blue tiberium can no longer explode.
$X=getX(chkShortGame)
$Y=getY(chkScrapDebris) + CHECKBOX_SPACING

[chkExtremeAI]
Text=Advanced AI
CustomIniPath=INI/Game Options/Advanced AI.ini
Checked=True
ToolTip=The AI cheats less, and instead plays much smarter than the original classic C&C AI, including expanding over the map and building many factories when its economy allows.
MapScoringMode=DenyWhenUnchecked
$X=270
$Y=getY(chkShortGame)

[chkTurtlingAI]
Text=Turtling AI
CustomIniPath=INI/Game Options/Turtling AI.ini
Checked=False
ToolTip=The AI will focus on just building its base and will rarely attack at all.
MapScoringMode=DenyWhenChecked
$X=getX(chkExtremeAI)
$Y=getY(chkExtremeAI) + CHECKBOX_SPACING

[chkInfiniteTiberium]
Text=Fast Resource Growth
CustomIniPath=INI/Game Options/Infinite Tiberium.ini
Checked=False
ToolTip=Tiberium trees and ore mines will spawn tiberium so fast that more than 10 harvesters are able to harvest from a single tiberium tree or ore mine without being able to deplete the tiberium or ore around it.
MapScoringMode=DenyWhenChecked
$X=getX(chkExtremeAI)
$Y=getY(chkTurtlingAI) + CHECKBOX_SPACING

[chkInstantUnload]
Text=Instant Harvester Unload
CustomIniPath=INI/Game Options/Instant Harvester Unload.ini
Checked=False
ToolTip=Harvesters instantly unload all tiberium/ore when they dock with the refinery, just like in Red Alert.
$X=getX(chkExtremeAI)
$Y=getY(chkInfiniteTiberium) + CHECKBOX_SPACING

[chkSilos]
Text=Silos Needed
Reversed=yes
CustomIniPath=INI/Game Options/No Silos.ini
Checked=True
ToolTip=Tiberium and ore are stored in refineries and silos with a limited storage capacity. Once they're full, you need to build more of them to be able to receive more credits.
$X=getX(chkExtremeAI)
$Y=getY(chkInstantUnload) + CHECKBOX_SPACING

[chkDestrBridges]
Text=Destroyable Low Bridges
SpawnIniOption=BridgeDestroy
Checked=True
ToolTip=You can destroy low bridges by force-firing on them.
$X=getX(chkExtremeAI)
$Y=getY(chkSilos) + CHECKBOX_SPACING

[chkRevealShroud]
Text=Revealed Map
CustomIniPath=INI/Game Options/Reveal Shroud.ini
Checked=False
ToolTip=The map will be entirely unshrouded when the game starts.
MapScoringMode=DenyWhenChecked
$X=getX(chkExtremeAI)
$Y=getY(chkDestrBridges) + CHECKBOX_SPACING

[chkShroudRegrows]
Text=Growing Shroud
CustomIniPath=INI/Game Options/Shroud Regrows.ini
Checked=False
ToolTip=Shroud slowly grows (back).
$X=getX(chkExtremeAI)
$Y=getY(chkRevealShroud) + CHECKBOX_SPACING

[chkStorms]
Text=Stormy Weather
CustomIniPath=INI/Game Options/Storms.ini
Checked=False
ToolTip=A storm will be present throughout the whole match, during which you'll be bombarded by lightning strikes and meteors.
$X=getX(chkExtremeAI)
$Y=getY(chkShroudRegrows) + CHECKBOX_SPACING

[chkNaval]
Text=Allow Ships
CustomIniPath=INI/Game Options/Naval.ini
Checked=True
ToolTip=Allow naval yards and ships to be built.
$X=getX(chkExtremeAI)
$Y=getY(chkStorms) + CHECKBOX_SPACING

[chkSuperWeapons]
Text=Super Weapons
Reversed=yes
CustomIniPath=INI/Game Options/Disable Super Weapons.ini
Checked=True
ToolTip=Players can use super weapons such as the nuke and ion cannon.
$X=getX(chkExtremeAI)
$Y=getY(chkNaval) + CHECKBOX_SPACING

[chkAutoDeployMCV]
Text=Auto Deploy MCV
SpawnIniOption=AutoDeployMCV
CustomIniPath=INI/Game Options/Auto Deploy MCV.ini
Checked=False
ToolTip=The Mobile Construction Vehicle will deploy automatically when the game starts.
Visible=False
Enabled=False

[chkCrew]
Text=Crew Survivors
Reversed=yes
CustomIniPath=INI/Game Options/No Crew.ini
Checked=True
ToolTip=Surviving crew members can escape from destroyed units and structures.
Visible=False
Enabled=False

[chkImmuneHarvs]
Text=Immune Harvesters
CustomIniPath=INI/Game Options/Immune Harvesters.ini
Checked=False
ToolTip=Harvesters are indestructible (but are no longer able to crush infantry).
Visible=False
Enabled=False
MapScoringMode=DenyWhenChecked

