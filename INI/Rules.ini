; ******* Armor Types *******

; Modifier = default Verses value for this armor (def=100%)
; ForceFire = whether warheads can by default force-fire at this armor type (def=yes)
; Retaliate = whether warheads can by default retaliate against this armor type (def=yes)
; PassiveAcquire = whether warheads can by default passive acquire this armor type (def=yes)
; BaseArmor = the armor that provides the default values for this armor

[ArmorTypes]
;=none
;=wood
;=light
;=heavy
;=concrete
0=medium
1=naval_light
2=naval_medium
3=naval_heavy
4=rocket
5=special

[light]
BaseArmor=wood

[concrete]
BaseArmor=heavy

[medium]
Modifier=1000%
ForceFire=yes
Retaliate=yes
PassiveAcquire=yes

[naval_light]
BaseArmor=light
Modifier=1000%
ForceFire=yes
Retaliate=yes
PassiveAcquire=yes

[naval_medium]
BaseArmor=medium
Modifier=1000%
ForceFire=yes
Retaliate=yes
PassiveAcquire=yes

[naval_heavy]
BaseArmor=heavy
Modifier=1000%
ForceFire=yes
Retaliate=yes
PassiveAcquire=yes

[rocket]
Modifier=1000%
ForceFire=yes
Retaliate=yes
PassiveAcquire=yes

[special_heavy]
BaseArmor=heavy


; ******* Weapon Statistics *******
; The weapons specified here are attached to the various combat
; units and buildings.

; Anim = animation to display as a firing effect [use 8 for directional variation]
; Burst = number of rapid succession shots from this weapon (def=1)
; BurstDelay# = delay between bursts [15 = 1 second at middle speed setting] (def=4) (up to BurstDelay3 is valid)
; Camera = Reveals area around firer (def=no)?
; Charges = Does it have charge-up-before-firing logic (def=no)?
; Damage = the amount of damage (unattenuated) dealt with every bullet
; Floater = floats like a frizbee
; Lobber = does the projectile fly to target in a high arc (def=no)?
; Projectile = projectile characteristic to use
; ROF = delay between shots [15 = 1 second at middle speed setting]
; Range = maximum cell range
; MinimumRange = minimum range to target (def=0)
; Report = List of sounds to random play when firing
; Speed = speed of projectile to target (100 is maximum)
; Warhead = warhead to attach to projectile
; Supress = Should nearby friendly buildings be scanned for and if found, discourage firing on target (def=no)?
; TurboBoost = Should the weapon get a boosted speed bonus when firing upon aircraft?
; UseFireParticles = Should the weapon spawn a flame particle system? (def = no)
; Bright = Does this weapons bullet cause a lighting effect when it impacts (def=no)? If set, this will override the warheads 'Bright' flag
; IonSensitive = Shuts down during an ion storm (def=no)?
; EBoltColor1 = <r,g,b> (def=255,255,255) Electric bolts are made up of 3 lines, these values define the colours for each of the lines
; EBoltColor2 = <r,g,b> (def=82,81,255)
; EBoltColor3 = <r,g,b> (def=82,81,255)
; EBoltSegmentCount = How many segment blocks should the electric bolt be made up from. A larger number will give a more "wild" effect (def=8)
; EBoltLifetime = The lifetime of the electric bolt graphic in game frames (def=17)
; EBoltIterations = How many draw iterations should the system perform (def=1)?
; EBoltDeviation = The maximum deviation from a straight line the electric bolts can be. A value of 0.0 will draw straight lines (def=1.0)
; OmniFire = Units don't ever have to rotate before firing this weapon. (def=no)

