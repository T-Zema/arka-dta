; Terran Faction PoC - wariant "przejety dom pomocniczy" (Modding/wiki/plans/new-faction.md)
; W skirmishu dom GDI1 (indeks 6, w Rules tylko pomocnik misji z ActsLike=0) staje sie grywalna frakcja Terran.
; Rules.ini, Enhance.ini i mapy misji nietkniete: ten plik doklejany jest tylko do skirmisha (MapCodeININame trybu Deathmatch).
; Etap 0: Terran = klon Aliantow (Owner+=GDI1 na typach Allies), GDI1 zdjety z typow GDI, ktore mial w Rules/Enhance.
; Wygenerowane 2026-10-24 z INI/Rules.ini + INI/Enhance.ini (tryb Enhanced). Po aktualizacji DTA wygeneruj ponownie.

[Sides]
TerranSide=GDI1

[TerranSide]
UIColor=White
OptionsMenuTextColor=76,163,255
ScreenTextColor=76,163,255
ToolTipColor=RAGold
