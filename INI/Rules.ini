; ===== StarCraft mod: Terran Nuclear Silo (Modding/wiki/mods/starcraft-terran-buildings.md) =====
; Disabled here (TechLevel=-1); INI/Game Options/StarCraft.ini [SCNUKE] turns it on. It has its own superweapon, like
; RAMSLO (MultiSpecial), TMPL (ChemicalSpecial) and RAPDOX (VortexSpecial). Its superweapon needs a UNIQUE Action= (NuclearStrike2):
; the map click fires the FIRST superweapon with the cursor's Action (Modding/wiki/engine/superweapons.md).
[SCNUKE]
Name=Nuclear Silo
TechLevel=-1
Prerequisite=none
Strength=4800
Armor=heavy
Owner=GDI1	; Terran faction only (2026-10-25: was GDI,Nod,Allies,Soviet,GDI1)
Cost=2500
Points=25
Power=-100
Powered=no
SuperWeapon=SCNukeSpecial
NukeSilo=yes
IsTemple=yes	; not needed for the launch (old guess), harmless
Capturable=false
Crewed=yes
Explosion=FBALL1,FBALL2,FBALL3
ScrapExplosion=FBALL1_SCRAP,FBALL2_SCRAP,FBALL3_SCRAP
MaxDebris=0
AIBuildThis=no

