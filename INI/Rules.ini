IronCurtainChangeRemap=false ; If set, the Iron Curtain effect changes the unit's remap color from the house color to IronCurtain (def=false).
IronCurtainSound=IRONCUR9
HarvesterUnderAttackThrottleTime=0.2 ; Minutes that EVA is forbidden from alerting about a harvester being under attack after last alerting about it. Automatically scaled by game speed (iow. it's real-life minutes)


; ******* Crate rules *******
; General crate rules and controls are specified here.
[CrateRules]
CrateMaximum=255            ; crates can never exceed this quantity
CrateMinimum=2              ; crates are normally one per human player but never below this number
CrateRadius=3.0             ; radius (cells) for area effect crate powerup bonuses
CrateRegen=3                ; average minutes between random powerup crate regeneration
SilverCrate=HealBase        ; solo play silver crate bonus
SoloCrateMoney=2000         ; money to give for money crate in solo play missions
UnitCrateType=none          ; specifies specific unit type for unit type crate ['none' means pick randomly]
WoodCrate=Money             ; solo play wood crate bonus
HealCrateSound=HEALER1      ; heal crate sound effect
WoodCrateImg=CRATE          ; wood crate overlay image to use	;was CRATE
CrateImg=SCRATE             ; normal crate overlay image to use ;was CRATE
FreeMCV=no	;yes            ; Give free MCV from crate if no buildings but still has money [multiplay only]?


; ******* Random Crate Powerups *******
; This specifies the chance for the specified crate powerup to appear
; in a 'random' crate. The chance is expressed in the form of 'shares'
; out of the total shares specified. The second parameter is the animation
; to use when this crate is picked up. The third parameter, if present, specifies
; the data value needed for that crate powerup. They mean different things
; for the different powerups.
[Powerups]
Armor=33,ARMOR,0.5          ; armor of nearby objects increased (armor divider)
Cloak=20,CLOAK              ; enable cloaking on nearby objects
Darkness=0,SHROUDX          ; cloak entire radar map
Explosion=7,RAPID,50        ; high explosive baddie (damage per explosion)
Firepower=28,FIREPOWR,2.0   ; firepower of nearby objects increased (firepower multiplier)
HealBase=23,HEALALL         ; all buildings to full strength
ICBM=10,CHEMISLE            ; LKO: airstrike one time shot (see MultiSpecial and MultiLauncher)
Money=35,MONEY,2500         ; a specific amount of cash (used to be the specified value + Random amount between 0 and 900)
Napalm=7,<none>,500         ; fire explosion baddie (damage)
Reveal=0,REVEAL             ; reveal entire radar map
Speed=30,SPEED,1.7          ; speed of nearby objects increased (speed multiplier)
Squad=0,<none>              ; squad of random infantry
Unit=70,<none>              ; vehicle
Invulnerability=15,AREAHEAL,1.0	; invulnerability (duration in minutes)
Veteran=30,VETERAN,1        ; veteran upgrade (levels to upgrade)
IonStorm=0,<none>           ; initiate ion storm
Gas=7,<none>,100            ; tiberium gas (damage for each gas cloud)
Tiberium=25,<none>          ; tiberium patch
Pod=5,MTRINIT               ; meteor shower baddie


; ******* Combat and damage rules *******
; General rules that control combat, damage, or related items are listed here.
[CombatDamage]
AmmoCrateDamage=200         ; damage generated from exploding ammo crate overlay
IonCannonDamage=600
HarvesterImmune=no          ; Are harvester immune to normal combat damage?
DestroyableBridges=yes      ; Can bridges be destroyed?
TiberiumExplosive=no        ; Is tiberium extra explosive?
Scorches=BURN01,BURN02,BURN03,BURN04  ; scorch mark smudge types
Scorches1=BURN05,BURN06,BURN07 ; scorch mark smudge types
Scorches2=BURN08,BURN09,BURN10 ; scorch mark smudge types
Scorches3=BURN11,BURN12,BURN13 ; scorch mark smudge types
Scorches4=BURN14,BURN15,BURN16 ; scorch mark smudge types
TiberiumExplosionDamage = 100 ; the amount of damage dealt out by explosion in a big tiberium chain reaction
TiberiumStrength = 20       ; the higher this value, the harder it is to get big tiberium to explode
Craters=CR1,CR2,CR3,CR4,CR5,CR6   ; crater smudge types
AtomDamage=600              ; damage points when nuclear bomb explodes (regardless of source)
BallisticScatter=1.0        ; maximum scatter distance (cells) for inaccurate ballistic projectiles
UseBridgeHealth=yes         ; enables bridges to have actual HP instead of a RNG % chance to get destroyed by each shot
BridgeArmor=naval_heavy
BridgeStrength=30000        ; strength of bridge [smaller means more easily destroyed], was 1500
IceStrength=5000            ; strength of traversable ice [smaller means more easily destroyed]
C4Delay=.03                 ; minutes to delay after placing C4 before building will explode
C4Warhead=TIBHE             ; this is the warhead that C4 uses to damage buildings
FirestormWarhead=FirestormWH ; the warhead that the firestorm defense uses when active
IonCannonWarhead=IonCannonWH ; the warhead that the ion cannon uses
VeinholeWarhead=VeinholeWH
BuildingFlameSpawnBlockFrames=600 ; when a building catches fire from damage, prevent it from catching more fire from damage state changes for this long to give the player a chance to repair it

;particle system defaults
DefaultFirestormExplosionSystem=FirestormSparkSys ; the particle system to use when the firestorm defense blows something up
DefaultLargeGreySmokeSystem=BigGreySmokeSys
DefaultSmallGreySmokeSystem=SmallGreySSys
DefaultSparkSystem=SparkSys
DefaultLargeRedSmokeSystem=BigGreySmokeSys
DefaultSmallRedSmokeSystem=SmallGreySSys
DefaultDebrisSmokeSystem=SmallGreySSys
DefaultFireStreamSystem=FireStreamSys
DefaultTestParticleSystem=TestSmokeSys
DefaultRepairParticleSystem=WeldingSys

Crush=1.0                   ; if this close (cells) to crushable target, then crush instead of firing upon it (computer only). was 0.8
ExpSpread=.7                ; cell damage spread per 100 damage points for exploding object types [if Explodes=yes]
FireSupress=4               ; radius from target to look for friendlies and thus discourage firing upon, if found
FlameDamage=Fire            ; damage (warhead type) to use when on object is in flames
FlameDamage2=Fire2          ; LKO: warhead used by all art.ini anims with damage except art.ini debris
HomingScatter=0.4           ; maximum scatter distance (cells) for inaccurate homing projectiles, was 2.0
MaxDamage=10000             ; maximum damage (after adjustments) per shot
MinDamage=-10000            ; minimum damage (after adjustments) per shot
PlayerAutoCrush=no          ; Will player controlled units automatically try to crush enemy infantry?
PlayerReturnFire=no         ; More aggressive return fire from player controlled objects?
PlayerScatter=no            ; Will player units scatter, of their own accord, from threats and damage?
;ProneDamage=50%            ; when infantry is prone, damage is reduced to this percentage
SplashList=H2O_EXP3,H2O_EXP2,H2O_EXP1 ; water explosion set for conventional explosives
TreeTargeting=no            ; Automatically show target cursor when over trees?
TurboBoost=5.0              ; speed multiplier for turbo-boosted weapons when firing upon aircraft
Incoming=10                 ; If an incoming projectile is as slow or slower than this, then
                            ; object in the target location will try to run away.
                            ; Grenades have this characteristic.
CollapseChance=0            ; Percent chance that a cliff will collapse when hit.
BerzerkAllowed=no           ; Allow Cyborgs to go berzerk when at half damage?

[LEVITATION]
Drag=0.1						; rate that jellyfish slows down
								; max velocity that jellyfish can move again when...
MaxVelocityWhenHappy=5.0		;   ...just puttering around
MaxVelocityWhenFollowing=4.5	;	...going someplace in particular
MaxVelocityWhenPissedOff=10.0	;	...tracking down some mofo
AccelerationProbability=0.01	; Chance happy jellyfish will "puff"
AccelerationDuration=20			; How long a puff accelerates the jellyfish
Acceleration=0.75				; How much a puff accelerates
InitialBoost=2.0				; How much of an initial speed boost does jellyfish get when puffing
;BounceVelocity=3.5				; How fast does jellyfish bounce away after hitting a wall.  Don't screw with this
;CollisionWaitDuration=15		; How long does jellyfish wait before puffing after hitting a wall?
MaxBlockCount=3					; How many times will jellyfish block against a wall before giving up on destination?
PropulsionSoundEffect=FLOATMOV,FLOTMOV2,FLOTMOV3,FLOTMOV4	; Sound effect when puffing
IntentionalDeacceleration=1.0	; How fast does it deaccelerate when it wants to? (When going to waypoint or target)
IntentionalDriftVelocity=12.0	; How fast does it move when it is near its target?
ProximityDistance=3.0			; How close before special deacceleration & drift logic take over?


