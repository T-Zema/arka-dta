[Empowerment]
; Terran faction (Modding/wiki/mods/terran-faction.md)
DisallowedPlayerSides=4,5,6,7,8
UIName=Empowerment
Description=$$$TextBlockBegin$$$
A game mode where your units and buildings get stronger as you destroy enemies.

Destroying buildings grants strength 3 times faster than destroying units, making aggression towards other players the key to victory.

Aside from the strengthening, Empowerment plays identically to the default "Deathmatch" mode.
$$$TextBlockEnd$$$
ForcedSpawnIniOptions=DefaultForcedSpawnIniOptions

[Survivor]
; Terran faction (Modding/wiki/mods/terran-faction.md)
DisallowedPlayerSides=4,5,6,7,8
Description=$$$TextBlockBegin$$$
Base building is unavailable, so you're entirely reliant on finding crates to gather units and power-ups.

Enabling "Short Game" will cause players to be instantly defeated when they lose their "Mobile HQ" unit.

This game mode does not have a functional AI and thus isn't available in Skirmish.
$$$TextBlockEnd$$$
MultiplayerOnly=yes
HumanPlayersOnly=yes
